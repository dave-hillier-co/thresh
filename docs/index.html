<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Thresh TypeScript virtual actor documentation" />
    <title>Thresh documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #6750a4;
      }
      .app-name-link {
        font-weight: 700;
      }
      .markdown-section {
        max-width: 920px;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading Thresh documentation…</div>
    <script>
      window.$docsify = {
        name: "Thresh",
        homepage: "guide/index.md",
        loadSidebar: true,
        auto2top: true,
        maxLevel: 3,
        subMaxLevel: 2,
        search: { placeholder: "Search", noData: "No results" },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
